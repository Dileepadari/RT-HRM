# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# No org.gradle.java.home here. It used to pin an absolute path to one
# machine's JDK 17, so the build could not start anywhere that path did not
# exist. The project's Java version is declared as a toolchain in
# app/build.gradle.kts instead, which Gradle resolves against any installed
# JDK 17 and can download if none is present.
